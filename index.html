<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>ICT 10</title>

<body>
    <div style="border: 5px solid #0DCAF0; border-radius: 15px; margin: 20px; padding: 10px">
    <form>
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <br>
                   <h1 style="color: #032830">Dance Club Checker</h1>
                    <br>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <label for="first" class="form-label">First Name:</label>
                    <input type="text" class="form-control" id="first" placeholder="Enter First Name">
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <label for="last" class="form-label">Last Name:</label>
                    <input type="text" class="form-control" id="last" placeholder="Enter Last Name">
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <br>
                    <button type="button" class="btn btn-info"py-click="checkname">Check</button>
                    <br><br>
                </div>
            </div>
        </div>
    </form>
    <div id="output1"></div>
    
    <script type="py" src="main.py"></script>
    </div>
